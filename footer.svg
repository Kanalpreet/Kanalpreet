<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-labelledby="t">
  <title id="t">Thanks for visiting</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset="0.55" stop-color="#14306B"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="170" rx="18"/></clipPath>
  </defs>
  <style>
    .w1 { animation: drift 16s linear infinite; }
    .w2 { animation: drift 11s linear infinite; }
    .w3 { animation: drift 7s linear infinite; }
    .l1 { font: 700 19px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; animation: rise 1s .1s ease-out both; }
    .l2 { font: 500 15px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #C4B5FD; letter-spacing: .5px; animation: rise 1s .4s ease-out both; }
    @keyframes drift { to { transform: translateX(-800px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1000" height="170" fill="url(#bg)"/>
    <text class="l1" x="500.0" y="62" text-anchor="middle">Building intelligent systems that are evaluated, reliable, and useful.</text>
    <text class="l2" x="500.0" y="92" text-anchor="middle">Thanks for stopping by. Let's build something that ships.</text>
    <path class="w1" d="M0,118 Q100,106 200,118 T400,118 T600,118 T800,118 T1000,118 T1200,118 T1400,118 T1600,118 T1800,118 L1800,170 L0,170 Z" fill="#FFFFFF" fill-opacity="0.06"/>
    <path class="w2" d="M0,132 Q100,122 200,132 T400,132 T600,132 T800,132 T1000,132 T1200,132 T1400,132 T1600,132 T1800,132 L1800,170 L0,170 Z" fill="#93C5FD" fill-opacity="0.10"/>
    <path class="w3" d="M0,146 Q100,138 200,146 T400,146 T600,146 T800,146 T1000,146 T1200,146 T1400,146 T1600,146 T1800,146 L1800,170 L0,170 Z" fill="#C4B5FD" fill-opacity="0.16"/>
  </g>
</svg>
