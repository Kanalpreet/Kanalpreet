  <style>
    .edge { stroke: #93C5FD; stroke-opacity: .22; stroke-width: 1; stroke-dasharray: 3 7; animation: flow 5s linear infinite; }
    .node { fill: #BFDBFE; transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
    .scan { animation: scan 9s ease-in-out infinite; }
    .name { font: 800 56px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: url(#nameFill); letter-spacing: -1px; animation: rise 1s .15s ease-out both; }
    .role { font: 600 20px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #DBEAFE; letter-spacing: .4px; animation: rise 1s .45s ease-out both; }
    .pill { animation: rise 1s .75s ease-out both; }
    .pilltxt { font: 500 15px 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #E0E7FF; }
    .dot { fill: #4ADE80; animation: blink 2s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -50; } }
    @keyframes pulse { 0%,100% { opacity: .3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.7); } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes scan { 0% { transform: translateX(-260px); } 100% { transform: translateX(1260px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
