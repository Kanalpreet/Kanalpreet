  <title id="t">Kanalpreet Kaur</title>
  <desc id="d">AI Engineer focused on RAG and agentic systems, with an animated neural-network background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
